<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5S Audit – Phoenix</title>
<style>
:root{--bg:#f4f3ee;--sf:#fff;--tx:#1d1c19;--mu:#68675f;--bd:#dcdad1;--ac:#1d5c47;--acb:#e2f0ea;--y:#1c7a4a;--yb:#dff2e6;--p:#9a6400;--pb:#fbeed0;--n:#b3261e;--nb:#fbe2df;--x:#5f5e57;--xb:#ebeae4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161614;--sf:#201f1c;--tx:#ecebe6;--mu:#a09f96;--bd:#3a3935;--ac:#4fb08f;--acb:#1f3a31;--y:#5fd08f;--yb:#1d3a2a;--p:#e6b04a;--pb:#3b2f14;--n:#ff8a80;--nb:#40201d;--x:#b3b2aa;--xb:#2c2b28;color-scheme:dark}}:root[data-theme=dark]{--bg:#161614;--sf:#201f1c;--tx:#ecebe6;--mu:#a09f96;--bd:#3a3935;--ac:#4fb08f;--acb:#1f3a31;--y:#5fd08f;--yb:#1d3a2a;--p:#e6b04a;--pb:#3b2f14;--n:#ff8a80;--nb:#40201d;--x:#b3b2aa;--xb:#2c2b28;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala","Iskoola Pota",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
select,input[type=text],input[type=month],textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0}
.stat{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{background:var(--acb);color:var(--ac);border-radius:99px;padding:3px 10px;font-weight:600;font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab,.chip{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tab.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip{border-radius:99px;padding:5px 11px;font-size:14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:14px}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.dng{color:var(--n)}
details.sec{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin:10px 0;overflow:hidden}
details.sec>summary{padding:12px;font-weight:650;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.cp{padding:12px;border-top:1px solid var(--bd)}
.top{display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.s{background:var(--xb);border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px}
.no{color:var(--mu);font-size:13px}
.prev{margin-left:auto;font-size:12px;color:var(--mu)}
.en{margin:2px 0;font-weight:560}.si{margin:2px 0 6px;color:var(--mu);font-size:13.5px}
.how{font-size:13px;color:var(--mu);margin:4px 0}.how summary{cursor:pointer;color:var(--ac)}.how div{white-space:pre-wrap;margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.btns button{border:1.5px solid var(--bd);background:var(--sf);border-radius:9px;padding:9px 2px;cursor:pointer;font-weight:600}
.btns button.on[data-v=YES]{background:var(--yb);color:var(--y);border-color:var(--y)}
.btns button.on[data-v=PARTIAL]{background:var(--pb);color:var(--p);border-color:var(--p)}
.btns button.on[data-v=NO]{background:var(--nb);color:var(--n);border-color:var(--n)}
.btns button.on[data-v=X]{background:var(--xb);color:var(--x);border-color:var(--x)}
textarea{width:100%;min-height:40px;resize:vertical}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.add{border:1px dashed var(--ac);color:var(--ac);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13.5px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
#ov[hidden]{display:none}
.md{background:var(--sf);border-radius:14px;padding:16px;max-width:760px;width:100%;max-height:88vh;overflow:auto}
.md h2{margin:0 0 10px;font-size:17px}.md label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}.md input[type=text],.md select{width:100%}
.md img.big{max-width:100%;max-height:68vh;display:block;margin:0 auto 10px;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}td,th{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:top}
.fi{margin:8px 0;padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:13.5px}.fi img{width:70px;height:70px;object-fit:cover;border-radius:6px;margin:4px 4px 0 0}
.mu{color:var(--mu);font-size:13px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--acb);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:10px 0}.bar.ok{background:var(--yb);color:var(--y);font-weight:600}.lk .btns button{pointer-events:none;opacity:.75}.lk .add{display:none}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:99px;z-index:60;font-size:14px}
#toast[hidden]{display:none}
.dash{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.dash .rad{grid-column:1/-1;text-align:center}
@media(min-width:680px){.dash{grid-template-columns:auto 1fr auto}.dash .rad{grid-column:auto}}
.ab{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.ab span:first-child{width:38%;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ab i{flex:1;height:9px;background:var(--xb,#ebeae4);border-radius:9px;overflow:hidden;display:block}.ab i b{display:block;height:100%;border-radius:9px}.ab em{width:38px;text-align:right;font-style:normal;font-weight:650}
.S1{background:rgba(124,92,214,.25)}.S2{background:rgba(40,130,220,.25)}.S3{background:rgba(30,170,120,.25)}.S4{background:rgba(230,160,30,.28)}.S5{background:rgba(220,70,90,.25)}
@media print{header,main,#toast{display:none!important}#ov{position:static;background:none;display:block;padding:0}.md{max-height:none;box-shadow:none}.noprint{display:none!important}}
.step{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:14px 0 6px;font-weight:700}
.ctx{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0 4px;font-size:16px}.ctx .ok{color:var(--y);font-weight:600;font-size:14px}
.gh{margin:18px 0 6px;font-size:15px}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.ent:hover{border-color:var(--ac)}
.btn[disabled]{opacity:.5;cursor:not-allowed}.pill.sub{background:var(--yb);color:var(--y)}
</style></head><body>
<header>
 <div class="row"><h1>5S Audit</h1>
  <input type="month" id="month" aria-label="Audit month">
  <input type="text" id="aud" placeholder="Auditor name" style="flex:1;min-width:120px">
  <button class="btn pri" id="rb" data-act="report">Final report</button>
  <button class="btn dng" data-act="wipe">Clear all data</button></div>
 <div class="stat" id="stat"></div>
</header>
<main id="app"></main>
<div id="ov" hidden></div><div id="toast" hidden></div>

<script>

 $('#stat').innerHTML=`<span class="pill">${esc(TT())} ${pct(segScore(sr))}</span><span class="pill">Submitted ${sr.entries.filter(x=>x.sub).length}/${sr.entries.length}</span>${sr.sub?'<span class="pill sub">Completed ✓</span>':''}`}
function shrink(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)})}
function modal(h){const o=$('#ov');o.innerHTML=`<div class="md">${h}</div>`;o.hidden=false}
const closeM=()=>{$('#ov').hidden=true;$('#ov').innerHTML=''};
function form(title,body,ok,cb){modal(`<h2>${title}</h2>${body}<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="x">Cancel</button><button class="btn pri" id="ok">${ok}</button></div>`);$('#ok').onclick=()=>{const o=$('#ov').firstChild;cb();if($('#ov').firstChild===o)closeM()}}
function addRep(){const g=segDef(S.seg),sr=rec(),n=sr.entries.filter(x=>x.kind==='rep').length+1,L=g.rep.label,B=g.rep.base||L,PS=g.rep.presets||[];
 form('Add '+L.toLowerCase(),`<label>Name / number</label><input type="text" id="fn" value="${B} ${n}">${PS.length?`<div class="row" style="margin-top:8px">${PS.map(p=>`<button class="btn" data-act="preset" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}`,'Add &amp; start audit',()=>{const nm=$('#fn').value.trim()||`${B} ${n}`,ne={id:uid(),kind:'rep',name:nm,tpl:g.rep.tpl,ans:{},sub:null};sr.entries.push(ne);S.ent=ne.id;save();render();scrollTo(0,0)})}
function finals(){const r=[];for(const k in S.audits){const[p,m]=k.split('|');if(m!==S.month)continue;const sg=S.audits[k].segs;for(const u in sg){const s=sg[u];if(s&&s.sub)r.push({p,g:segDef(s.g||u),loc:s.loc||'',s,E:sorted(s)})}}return r.sort((x,y)=>x.s.sub.at-y.s.sub.at)}
const ttl=x=>unitTitle(x.g,x.p,x.loc);
function repBody(L=finals()){let h=`<h2>5S Audit – Final Report · ${esc(S.month)}</h2>`;
 if(!L.length)return h+'<p class="mu">Nothing submitted yet. Complete a plant under a segment (for example Manufacturing – FCC) and submit it.</p>';
 h+=`<p class="mu">${L.length} plant audit(s) submitted · Overall average <b>${pct(avg(L.map(x=>segScore(x.s))))}</b></p><table><tr><th>Segment – plant</th><th>Entries</th><th>Auditor</th><th>Score</th></tr>${L.map(x=>`<tr><td>${esc(ttl(x))}</td><td>${x.E.length}</td><td>${esc(x.s.sub.by||'—')}</td><td>${pct(segScore(x.s))}</td></tr>`).join('')}</table>`;
 h+=`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0">${ring(avg(L.map(x=>segScore(x.s))),96)}<div style="flex:1;min-width:200px">${L.map(x=>abar(ttl(x),segScore(x.s))).join('')}</div></div>`;
 L.forEach(x=>{h+=`<h3 style="margin:20px 0 4px">${esc(ttl(x))} · ${pct(segScore(x.s))}</h3><div class="mu">Submitted ${new Date(x.s.sub.at).toLocaleString()} · Auditor ${esc(x.s.sub.by||'—')}</div><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0">${ring(segScore(x.s),84)}<div style="flex:1;min-width:180px">${x.E.map(a=>abar(a.name,calc(a).sc)).join('')}</div>${radar(sScores(x.E),230)}</div><table><tr><th>Entry</th><th>Type</th><th>Answered</th><th>Score</th></tr>${x.E.map(a=>{const c=calc(a);return`<tr><td>${esc(a.name)}</td><td>${a.kind==='rep'?esc(x.g.rep.label):'Common'}</td><td>${c.d}/${c.t}</td><td>${pct(c.sc)}</td></tr>`}).join('')}</table>`;
  let n=0;x.E.forEach(a=>DATA.tpls[a.tpl].forEach(s=>s.items.forEach((it,i)=>{const r=a.ans[it.id];if(!r||(r.v!=='NO'&&r.v!=='PARTIAL'))return;n++;h+=`<div class="fi"><b>${esc(a.name)} › ${s.no}.${i+1}</b> – ${LB[r.v]}<br>${esc(it.en)}${r.n?`<br><i>${esc(r.n)}</i>`:''}<br>${(r.p||[]).map(u=>`<img src="${u}" alt="">`).join('')}</div>`})));if(!n)h+='<p class="mu">No findings.</p>'});
 return h}
function xlsx(L=finals()){const T=[['Segment','Plant','Location','Entries','Score %','Auditor','Submitted']],A=[['Segment','Plant','Location','Type','Entry','Answered','Total','Score %','Entry submitted']],D=[['Segment','Plant','Location','Entry','Section','No','S','Checkpoint','Result','Remark','Photos']];
 L.forEach(x=>{T.push([x.g.name,x.p,x.loc||'',x.E.length,Math.round((segScore(x.s)||0)*1000)/10,x.s.sub.by||'',new Date(x.s.sub.at).toLocaleString()]);x.E.forEach(a=>{const c=calc(a);A.push([x.g.name,x.p,x.loc||'',a.kind==='rep'?x.g.rep.label:'Common',a.name,c.d,c.t,c.sc==null?'':Math.round(c.sc*1000)/10,a.sub?new Date(a.sub.at).toLocaleString():'']);DATA.tpls[a.tpl].forEach(s=>s.items.forEach((it,i)=>{const r=a.ans[it.id];if(r&&r.v)D.push([x.g.name,x.p,x.loc||'',a.name,s.name,s.no+'.'+(i+1),it.s,it.en,LB[r.v],r.n||'',(r.p||[]).length])}))})});
 const wb=XLSX.utils.book_new();[['Totals',T],['Entries',A],['Details',D]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),n));return XLSX.write(wb,{type:'array',bookType:'xlsx'})}
const htmlDoc=(L)=>`<!DOCTYPE html><html><head><meta charset="utf-8"><title>5S Audit ${S.month}</title><style>body{font:14px system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 12px;color:#1d1c19}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}.fi{border:1px solid #ddd;border-radius:8px;padding:8px;margin:8px 0}.fi img{width:140px;height:140px;object-fit:cover;margin:4px 4px 0 0}.mu{color:#666}.ab{display:flex;align-items:center;gap:8px;margin:5px 0}.ab span:first-child{width:38%}.ab i{flex:1;height:9px;background:#ebeae4;border-radius:9px;overflow:hidden;display:block}.ab i b{display:block;height:100%}.ab em{width:38px;text-align:right;font-style:normal;font-weight:600}</style></head><body>${repBody(L)}</body></html>`;
async function dl(name,data){try{const d=typeof claude!=='undefined'&&claude.use?await claude.use('downloads'):null;if(d){await d.save({filename:name,data});toast('Report saved');return}}catch(e){if(e&&e.code==='declined')return}
 try{const b=new Blob([data],{type:name.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/html'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Download started. If nothing downloads, open this page from its claude.ai link, or use Print / PDF')}catch(e){toast('Download is not available here – use Print / PDF')}}
function report(){const L=finals(),n=L.length;modal((n?`<h3 style="margin:0 0 6px" class="noprint">Report for each section</h3>`+L.map((x,i)=>`<div class="ent noprint" style="cursor:default"><div style="min-width:0"><b>${esc(ttl(x))}</b><div class="mu">${pct(segScore(x.s))} · ${x.E.length} entries</div></div><div class="row"><button class="btn pri" data-act="dlx1" data-i="${i}">Excel</button><button class="btn pri" data-act="dlh1" data-i="${i}">Report</button></div></div>`).join(''):'')+repBody(L)+`<div class="row noprint" style="margin-top:14px"><button class="btn pri" data-act="dlx" ${n?'':'disabled'}>All sections – Excel</button><button class="btn pri" data-act="dlh" ${n?'':'disabled'}>All sections – Report</button><button class="btn" data-act="print">Print / PDF</button><button class="btn" data-act="x">Close</button></div>`)}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const act=t.dataset.act;
 if(act==='x'){closeM();return}
 const g=segDef(S.seg),sr=ready()?rec():null,en=sr&&S.ent?sr.entries.find(x=>x.id===S.ent):null,cp=t.closest('.cp');
 if(['set','ren','cpv','clr','del'].includes(act)&&en&&ro(en)){toast(sr.sub?'Segment submitted – reopen it to edit':'Entry submitted – reopen it to edit');return}
 if(act==='seg'){S.seg=t.dataset.i;if(!segDef(S.seg).plants.includes(S.plant))S.plant='';S.loc='';S.ent=null;save();render()}
 else if(act==='loc'){S.loc=t.dataset.i;S.ent=null;save();render()}
 else if(act==='newloc'){closeM();S.loc='';S.ent=null;save();render();scrollTo(0,0)}
 else if(act==='preset'){$('#fn').value=t.dataset.v}
 else if(act==='addloc')form('Add location',`<label>Location name</label><input type="text" id="fn" placeholder="e.g. Engineering Work Shop">`,'Add',()=>{const nm=$('#fn').value.trim();if(!nm)return;const L=locsOf(S.plant);if(!L.some(x=>x.toLowerCase()===nm.toLowerCase()))L.push(nm);S.loc=L.find(x=>x.toLowerCase()===nm.toLowerCase());S.ent=null;save();render()})
 else if(act==='plant'){S.plant=t.dataset.i;S.loc='';S.ent=null;save();render()}
 else if(act==='open'){S.ent=t.dataset.id;render();scrollTo(0,0)}
 else if(act==='back'){closeM();S.ent=null;render();scrollTo(0,0)}
 else if(act==='addrep'){if(sr.sub){toast('Reopen the segment to add more');return}addRep()}
 else if(act==='addnext'){closeM();S.ent=null;render();addRep()}
 else if(act==='gocom'){closeM();S.ent=sr.entries.find(x=>x.kind==='com').id;render();scrollTo(0,0)}
 else if(act==='set'){const x=ans(en,cp.dataset.id);x.v=x.v===t.dataset.v?'':t.dataset.v;save();rr()}
 else if(act==='view'){const x=ans(en,cp.dataset.id),i=+t.dataset.i;modal(`<img class="big" src="${x.p[i]}" alt="Audit photo"><div class="row" style="justify-content:flex-end">${ro(en)?'':'<button class="btn dng" id="dp">Delete photo</button>'}<button class="btn" data-act="x">Close</button></div>`);if($('#dp'))$('#dp').onclick=()=>{x.p.splice(i,1);save();closeM();rr()}}
 else if(act==='ren')form('Rename',`<input type="text" id="fn" value="${esc(en.name)}">`,'Save',()=>{en.name=$('#fn').value.trim()||en.name;save();rr()});
 else if(act==='del')form('Delete this entry?',`<p>“${esc(en.name)}” with its answers and photos will be removed.</p>`,'Delete',()=>{sr.entries=sr.entries.filter(x=>x!==en);S.ent=null;save();render()});
 else if(act==='clr')form('Clear answers?',`<p>Clears all answers, remarks and photos in “${esc(en.name)}”.</p>`,'Clear',()=>{en.ans={};save();rr()});
 else if(act==='cpv'){let n=0;for(const id in PV){const x=ans(en,id);if(!x.v){x.v=PV[id];n++}}save();rr();toast(`Copied ${n} answers from last month`)}
 else if(act==='submit'){const c=calc(en);form('Submit this entry?',`<p><b>${esc(en.name)}</b> · score ${pct(c.sc)}</p><p>${c.t-c.d?`${c.t-c.d} checkpoints are unanswered and will not be scored.`:'All checkpoints are answered.'}</p>`,'Submit',()=>{en.sub={at:Date.now(),by:S.auditor};if(!g.rep)sr.sub=en.sub;save();render();const com=sr.entries.find(x=>x.kind==='com');
   modal(`<h2>Submitted ✓</h2><p>${esc(en.name)} · ${esc(TT())}</p><div class="row">${en.kind==='rep'?`<button class="btn pri" data-act="addnext">+ Next ${g.rep.label.toLowerCase()}</button>`:''}${!com.sub?`<button class="btn ${en.kind==='rep'?'':'pri'}" data-act="gocom">${g.com.group.replace(/ \(.*\)/,'')}</button>`:''}${!g.rep?'<button class="btn pri" data-act="secrep">This report</button><button class="btn" data-act="newplant">Another office</button>':''}<button class="btn" data-act="back">All entries</button></div>`)})}
 else if(act==='reopen'){delete en.sub;save();rr()}
 else if(act==='final')form('Complete &amp; submit?',`<p><b>${esc(TT())}</b></p><p>Overall score <b>${pct(segScore(sr))}</b> from ${sr.entries.length} entries.</p><p class="mu">You can reopen it later if you need to correct something.</p>`,'Submit',()=>{sr.sub={at:Date.now(),by:S.auditor};save();render();modal(`<h2>Submitted ✓</h2><p>${esc(TT())}</p><div class="row"><button class="btn pri" data-act="secrep">This section’s report</button>${S.seg==='non'?'<button class="btn" data-act="newloc">Another location</button>':''}<button class="btn" data-act="newplant">${S.seg==='off'?'Another office':'Another plant'}</button><button class="btn" data-act="report">All reports</button></div>`)});
 else if(act==='reopenseg'){sr.sub=null;if(!g.rep)sr.entries.forEach(x=>{x.sub=null});save();render();toast('Segment reopened')}
 else if(act==='newplant'){closeM();S.plant='';S.ent=null;save();render();scrollTo(0,0);toast('Select the next plant')}
 else if(act==='report')report();
 else if(act==='print')window.print();
 else if(act==='wipe')form('Clear ALL data?','<p>This deletes every audit, answer, remark, photo and submission stored in this browser. It cannot be undone.</p><p class="mu">Download the final report first if you still need it.</p>','Clear everything',()=>{S={plant:'',loc:'',locs:{},month:S.month,auditor:'',seg:'mfg',ent:null,audits:{}};try{localStorage.removeItem('fs5v2')}catch(e){}save();render();toast('All data cleared')});
 else if(act==='dlx1'||act==='dlh1'){const x=finals()[+t.dataset.i];if(!x)return;const nm=`5S_Audit_${x.g.name}_${x.p}_${x.loc||''}_${S.month}`.replace(/[^\w-]+/g,'_');if(act==='dlx1'){if(typeof XLSX==='undefined')toast('Excel export is not available');else dl(nm+'.xlsx',xlsx([x]))}else dl(nm+'.html',htmlDoc([x]))}
 else if(act==='secrep'){const i=finals().findIndex(x=>x.p===S.plant&&x.g.id===S.seg&&(x.loc||'')===S.loc),x=finals()[i];if(!x)return;modal(repBody([x])+`<div class="row noprint" style="margin-top:14px"><button class="btn pri" data-act="dlx1" data-i="${i}">Download Excel</button><button class="btn pri" data-act="dlh1" data-i="${i}">Download report with photos</button><button class="btn" data-act="print">Print / PDF</button><button class="btn" data-act="x">Close</button></div>`)}
 else if(act==='dlx'){if(typeof XLSX==='undefined')toast('Excel export is not available');else dl(`5S_Audit_${S.month}.xlsx`,xlsx())}
 else if(act==='dlh')dl(`5S_Audit_${S.month}.html`,htmlDoc())});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){const sr=rec(),en=sr.entries.find(x=>x.id===S.ent);if(en&&!ro(en)){ans(en,e.target.closest('.cp').dataset.id).n=e.target.value;save()}}else if(e.target.id==='aud'){S.auditor=e.target.value;save()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='month'&&t.value){S.month=t.value;S.ent=null;save();render()}
 else if(t.matches('[data-file]')){const sr=rec(),en=sr.entries.find(x=>x.id===S.ent);if(!en||ro(en))return;const x=ans(en,t.closest('.cp').dataset.id);for(const f of t.files){const u=await shrink(f);if(u)x.p.push(u)}save();rr()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.ent'))e.target.click()});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.sec')){d.open?open.add(d.dataset.k):open.delete(d.dataset.k)}},true);
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
render();
</script></body></html>
